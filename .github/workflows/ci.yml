name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check GitFlow target
        env:
          GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 scripts/check_branch_policy.py

  check:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # audit-check falls back to stdout for read-only fork PR tokens.
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run checks
        run: make check

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Python dependency audit
        run: |
          uv export --locked --no-dev --all-extras --no-emit-project \
            --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uvx pip-audit --strict --require-hashes \
            --requirement "$RUNNER_TEMP/audit-requirements.txt"

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: sandbox-runner

      - name: History secret scan
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="--all" .

      - name: Build Python distributions
        run: uv build

      - name: Build MCP Docker image
        run: docker build --build-arg CARLA_VERSION=0.9.16 -t carla-agentic-toolkit:ci .

      - name: Verify hardened container runtime
        run: |
          docker run --rm --network none carla-agentic-toolkit:ci carla-agentic-toolkit-preflight
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --tmpfs /output:rw,nosuid,nodev,uid=10001,gid=10001 \
            carla-agentic-toolkit:ci /app/.venv/bin/python \
            -c 'import carla, ssl, sqlite3, uuid; from carla_agentic_toolkit.preflight import main; main()'

      - name: Docker vulnerability scan
        env:
          # Trivy 0.75.0: public database download, then network-isolated artifact scan.
          TRIVY_IMAGE: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          mkdir -p "$RUNNER_TEMP/container-scan"
          docker save --output "$RUNNER_TEMP/container-scan/image.tar" carla-agentic-toolkit:ci
          docker run --rm \
            --mount type=volume,source=carla-trivy-cache,target=/root/.cache/trivy \
            "$TRIVY_IMAGE" image --download-db-only --skip-version-check --disable-telemetry
          docker run --rm --network none \
            --mount type=volume,source=carla-trivy-cache,target=/root/.cache/trivy \
            --mount "type=bind,source=$RUNNER_TEMP/container-scan,target=/scan" \
            "$TRIVY_IMAGE" image --input /scan/image.tar \
            --skip-db-update --skip-java-db-update --skip-version-check --disable-telemetry \
            --offline-scan --scanners vuln --severity HIGH,CRITICAL --exit-code 1
