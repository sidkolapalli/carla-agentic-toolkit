name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: make check

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Python dependency audit
        run: uvx pip-audit --requirement <(uv export --locked --no-dev)

      - name: Rust dependency audit
        uses: rustsec/audit-check@717aa0b3183beac7a7e377f3d5436550be64f2c0 # v2.0.0
        with:
          manifest-path: sandbox-runner/Cargo.lock

      - name: History secret scan
        uses: zricethezav/gitleaks-action@d3367bf7a9f9bba2e9196923b46b36a56c86371f # v1.8.0
        with:
          args: --verbose

      - name: Build Python distributions
        run: uv build

      - name: Build MCP Docker image
        run: docker build --build-arg CARLA_VERSION=0.9.16 -t carla-agentic-toolkit:ci .

      - name: Docker vulnerability scan
        uses: docker/scout-action@a2fbd7b1cee49195fdefd79b983120b0a5a16bb3 # v1.19.1
        with:
          command: cves
          image: carla-agentic-toolkit:ci
          only-severities: critical,high
          exit-code: true
