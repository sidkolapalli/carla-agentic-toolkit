[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carla-agentic-toolkit"
version = "0.1.0"
description = "MCP server for controlling, diagnosing, and recording CARLA simulations through the CARLA Python API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.0.0,<3",
]

[project.optional-dependencies]
jev = ["typesafe-sdk==0.7.2"]

[project.scripts]
carla-agentic-toolkit = "carla_agentic_toolkit.server:main"
carla-agentic-toolkit-windows = "carla_agentic_toolkit.windows_launcher:main"
carla-agentic-toolkit-preflight = "carla_agentic_toolkit.preflight:main"
carla-agentic-toolkit-experiment = "carla_agentic_toolkit.managed_cli:main"
carla-agentic-toolkit-recover-scripts = "carla_agentic_toolkit.script_recovery_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "radon>=6.0.1",
    "ruff>=0.8.0",
    "ty>=0.0.1a20",
]

[tool.hatch.build.targets.sdist]
# Package the reproducible project inputs, never arbitrary local audit reports.
only-include = [
    "src/carla_agentic_toolkit",
    "tests",
    "scripts",
    "docs",
    "sandbox-runner/src",
    "sandbox-runner/tests",
    "sandbox-runner/Cargo.toml",
    "sandbox-runner/Cargo.lock",
    ".github",
    ".dockerignore",
    ".gitattributes",
    ".gitignore",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "Dockerfile",
    "LICENSE",
    "Makefile",
    "README.md",
    "SECURITY.md",
    "pyproject.toml",
    "uv.lock",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/*.egg-info",
    "**/.venv",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.ty_cache",
    "**/target",
    "**/dist",
    "**/strix_runs",
    "**/.env",
    "**/.env.*",
    "!**/.env.example",
    "!**/.env.*.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/windows_e2e.py" = ["S603"]
"src/carla_agentic_toolkit/sandbox.py" = ["S603"]
"src/carla_agentic_toolkit/windows_launcher.py" = ["S603"]
"src/carla_agentic_toolkit/script_runner.py" = ["BLE001"]
"tests/test_preflight.py" = ["S101", "S603"]
"tests/test_windows_launcher.py" = ["S101", "S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.rules]
unresolved-import = "ignore"
